# =============================================================================
# flume/flume-hdfs.conf — Cấu hình Apache Flume Agent nạp log vào HDFS
#
# Đề tài: Log Analysis and Anomaly Detection for Web Servers (SIC Group 3)
# Thành viên phụ trách: Dang Van Vinh
#
# Kiến trúc Flume Agent:
#   a1.sources: r1 (Spooling Directory Source theo dõi thư mục log)
#   a1.channels: c1 (Memory Channel đệm dữ liệu)
#   a1.sinks: k1 (HDFS Sink ghi file phân vùng theo ngày trên HDFS)
# =============================================================================

# Đặt tên các thành phần của Agent 'a1'
a1.sources = r1
a1.channels = c1
a1.sinks = k1

# -----------------------------------------------------------------------------
# 1. Cấu hình Source (Spooling Directory)
# -----------------------------------------------------------------------------
a1.sources.r1.type = spooldir
# Thư mục giám sát (start_flume.sh sẽ tự điền đường dẫn tuyệt đối)
a1.sources.r1.spoolDir = @SPOOL_DIR@
a1.sources.r1.fileHeader = true
a1.sources.r1.fileSuffix = .COMPLETED
a1.sources.r1.deletePolicy = never

# Thêm Interceptor để trích xuất Timestamp phục vụ phân vùng HDFS (%Y-%m-%d)
a1.sources.r1.interceptors = i1
a1.sources.r1.interceptors.i1.type = timestamp

# -----------------------------------------------------------------------------
# 2. Cấu hình Channel (Memory Channel)
# -----------------------------------------------------------------------------
a1.channels.c1.type = memory
a1.channels.c1.capacity = 10000
a1.channels.c1.transactionCapacity = 1000

# -----------------------------------------------------------------------------
# 3. Cấu hình Sink (HDFS Sink)
# -----------------------------------------------------------------------------
a1.sinks.k1.type = hdfs
# Đường dẫn trên HDFS phân vùng theo ngày tự động
a1.sinks.k1.hdfs.path = hdfs://localhost:9000/data/raw/%Y-%m-%d
a1.sinks.k1.hdfs.filePrefix = access-raw
a1.sinks.k1.hdfs.fileSuffix = .log
a1.sinks.k1.hdfs.fileType = DataStream
a1.sinks.k1.hdfs.writeFormat = Text

# Quy tắc cuộn file (Roll logic)
# Đóng file sau 10s không có log mới hoặc khi file đạt 10MB
a1.sinks.k1.hdfs.rollInterval = 10
a1.sinks.k1.hdfs.rollSize = 10485760
a1.sinks.k1.hdfs.rollCount = 0
a1.sinks.k1.hdfs.batchSize = 1000

# Sử dụng múi giờ địa phương
a1.sinks.k1.hdfs.useLocalTimeStamp = true

# -----------------------------------------------------------------------------
# 4. Liên kết Source và Sink với Channel
# -----------------------------------------------------------------------------
a1.sources.r1.channels = c1
a1.sinks.k1.channel = c1
